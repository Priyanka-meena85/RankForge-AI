<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f6f8f6" />
    <meta name="description" content="Plan industrial content, prepare structured drafts, and coordinate team review in a shared workspace built for technical B2B teams." />
    <meta property="og:title" content="RankForge AI — Industrial content, engineered" />
    <meta property="og:description" content="An industrial content workflow for teams, reviewers, and agencies." />
    <meta property="og:type" content="website" />
    <title>RankForge AI — Industrial content, engineered</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <svg class="icon-library" aria-hidden="true" xmlns="http://www.w3.org/2000/svg">
      <symbol id="i-grid" viewBox="0 0 24 24"><rect x="3.5" y="3.5" width="7" height="7" rx="1.5"/><rect x="13.5" y="3.5" width="7" height="7" rx="1.5"/><rect x="3.5" y="13.5" width="7" height="7" rx="1.5"/><rect x="13.5" y="13.5" width="7" height="7" rx="1.5"/></symbol>
      <symbol id="i-layers" viewBox="0 0 24 24"><path d="m12 3 9 5-9 5-9-5 9-5Z"/><path d="m3 12 9 5 9-5M3 16l9 5 9-5"/></symbol>
      <symbol id="i-file" viewBox="0 0 24 24"><path d="M13 3H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V10Z"/><path d="M13 3v7h7M8 14h8M8 17h6"/></symbol>
      <symbol id="i-send" viewBox="0 0 24 24"><path d="M21 3 10 14"/><path d="m21 3-7 18-4-7-7-4 18-7Z"/></symbol>
      <symbol id="i-chart" viewBox="0 0 24 24"><path d="M4 19V5M4 19h17"/><path d="m7 15 4-4 3 2 6-7"/></symbol>
      <symbol id="i-settings" viewBox="0 0 24 24"><path d="M12 8.5a3.5 3.5 0 1 0 0 7 3.5 3.5 0 0 0 0-7Z"/><path d="m19.4 15 .1.1a1.8 1.8 0 1 1-2.5 2.5l-.1-.1a1.8 1.8 0 0 0-3 .8v.2a1.8 1.8 0 1 1-3.6 0v-.2a1.8 1.8 0 0 0-3-.8l-.1.1a1.8 1.8 0 1 1-2.5-2.5l.1-.1a1.8 1.8 0 0 0-.8-3H4a1.8 1.8 0 1 1 0-3.6h.2a1.8 1.8 0 0 0 .8-3l-.1-.1a1.8 1.8 0 1 1 2.5-2.5l.1.1a1.8 1.8 0 0 0 3-.8V2a1.8 1.8 0 1 1 3.6 0v.2a1.8 1.8 0 0 0 3 .8l.1-.1a1.8 1.8 0 1 1 2.5 2.5l-.1.1a1.8 1.8 0 0 0 .8 3h.2a1.8 1.8 0 1 1 0 3.6H20a1.8 1.8 0 0 0-.6 2.9Z"/></symbol>
      <symbol id="i-search" viewBox="0 0 24 24"><circle cx="10.8" cy="10.8" r="6.8"/><path d="m16 16 4.5 4.5"/></symbol>
      <symbol id="i-bell" viewBox="0 0 24 24"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9ZM10 21h4"/></symbol>
      <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
      <symbol id="i-arrow" viewBox="0 0 24 24"><path d="M5 12h14m-6-6 6 6-6 6"/></symbol>
      <symbol id="i-chevron" viewBox="0 0 24 24"><path d="m9 18 6-6-6-6"/></symbol>
      <symbol id="i-check" viewBox="0 0 24 24"><path d="m5 12 4 4L19 6"/></symbol>
      <symbol id="i-close" viewBox="0 0 24 24"><path d="m6 6 12 12M18 6 6 18"/></symbol>
      <symbol id="i-menu" viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h16"/></symbol>
      <symbol id="i-spark" viewBox="0 0 24 24"><path d="m12 3 1.9 5.8L20 11l-6.1 2.2L12 19l-1.9-5.8L4 11l6.1-2.2L12 3Z"/><path d="m19 15 .9 2.1L22 18l-2.1.9L19 21l-.9-2.1L16 18l2.1-.9L19 15Z"/></symbol>
      <symbol id="i-clock" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></symbol>
      <symbol id="i-external" viewBox="0 0 24 24"><path d="M14 4h6v6M20 4l-9 9"/><path d="M18 13v5a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h5"/></symbol>
    </svg>

    <div id="publicSite"></div>
    <div id="authGate" hidden></div>
    <div class="app-shell" id="productApp" hidden>
      <aside class="sidebar" id="sidebar">
        <a class="brand" href="#" aria-label="RankForge AI home" data-view="dashboard">
          <img class="brand-logo" src="assets/rankforge-ai-logo.png" alt="RankForge AI" />
        </a>
        <div class="workspace-switcher">
          <span class="workspace-avatar">N</span>
          <span class="workspace-copy"><strong>Northstar workspace</strong><small>Starter workspace</small></span>
          <button class="switch-chevron" id="workspaceSwitcher" aria-label="Switch workspace">⌄</button>
        </div>
        <div class="nav-label">WORKSPACE</div>
        <nav class="main-nav" aria-label="Main navigation">
          <button class="nav-item active" data-view="dashboard"><svg><use href="#i-grid"/></svg><span>Overview</span></button>
          <button class="nav-item" data-view="topics"><svg><use href="#i-layers"/></svg><span>Topics &amp; batches</span><span class="nav-count">3</span></button>
          <button class="nav-item" data-view="review"><svg><use href="#i-file"/></svg><span>Content review</span><span class="nav-count hot">8</span></button>
          <button class="nav-item" data-view="published"><svg><use href="#i-send"/></svg><span>Published pages</span></button>
          <button class="nav-item" data-view="clients"><svg><use href="#i-grid"/></svg><span>Client workspaces</span><span class="nav-count">3</span></button>
          <button class="nav-item disabled" data-view="analytics" aria-disabled="true"><svg><use href="#i-chart"/></svg><span>Analytics</span><span class="soon">V1</span></button>
        </nav>
        <div class="nav-label nav-label-spaced">MANAGE</div>
        <nav class="main-nav" aria-label="Workspace management">
          <button class="nav-item" data-view="team"><svg><use href="#i-grid"/></svg><span>Team &amp; access</span></button>
          <button class="nav-item" data-view="settings"><svg><use href="#i-settings"/></svg><span>Settings</span></button>
          <button class="nav-item" data-view="plans"><svg><use href="#i-chart"/></svg><span>Plan &amp; usage</span></button>
        </nav>
        <div class="sidebar-bottom">
          <div class="help-card">
            <div class="help-icon"><svg><use href="#i-spark"/></svg></div>
            <strong>Built for your industry</strong>
            <p>Explore a ready-made industrial taxonomy to plan your next batch.</p>
            <button data-view="topics">Explore topics <svg><use href="#i-arrow"/></svg></button>
          </div>
          <div class="profile-row">
            <span class="profile-avatar">AM</span>
            <span class="profile-copy"><strong>Alex Morgan</strong><small>Workspace owner</small></span>
            <button class="more-button" id="signOutButton" aria-label="Sign out">↗</button>
          </div>
        </div>
      </aside>

      <main class="main-area">
        <header class="topbar">
          <button class="mobile-menu icon-button" id="mobileMenu" aria-label="Open menu"><svg><use href="#i-menu"/></svg></button>
          <div class="breadcrumbs"><span>Northstar workspace</span><svg><use href="#i-chevron"/></svg><strong id="breadcrumbCurrent">Overview</strong></div>
          <div class="topbar-actions">
            <label class="search-box"><svg><use href="#i-search"/></svg><input id="globalSearch" type="search" placeholder="Search pages, topics..." /><kbd>⌘ K</kbd></label>
            <button class="icon-button notification-button" aria-label="Notifications"><svg><use href="#i-bell"/></svg><i></i></button>
            <button class="top-avatar" aria-label="Account">AM</button>
          </div>
        </header>
        <div class="page-content" id="appMain"></div>
        <footer class="app-footer"><span>RankForge AI <span class="footer-dot">·</span> Industrial content, engineered.</span><span>Prototype workspace <span class="footer-dot">·</span> Sample data</span></footer>
      </main>
    </div>
    <div class="modal-backdrop" id="modalBackdrop" hidden>
      <section class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
        <button class="modal-close icon-button" id="closeModal" aria-label="Close"><svg><use href="#i-close"/></svg></button>
        <div id="modalContent"></div>
      </section>
    </div>
    <div class="toast-region" id="toastRegion" aria-live="polite"></div>
    <script src="app.js"></script>
  </body>
</html>
